name: Build and deploy to GitHub Pages

# Runs on every push to main, and can be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel an in-flight publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # The site is served from https://<user>.github.io/<repo>/ so assets need that prefix.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # turns Pages on (source: GitHub Actions) if it isn't yet

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true # don't fail the job yet — we retry below
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15

      # GitHub Pages sometimes flakes with "Deployment failed, try again later";
      # a spaced second attempt usually lands.
      - name: Cool down before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
